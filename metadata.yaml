name: astrbot_plugin_humanlike
display_name: 人味层 · 让叶铭像个人
short_desc: 给叶铭加"读→想→打字"的节奏、三条情绪轴和不回消息的权利，压掉助手腔与 Markdown
desc: |-
  把机器人从"有问必答的客服"改造成"群里的一个真人"。

  四层机制：
  1. 节奏层：被叫到后先"读"再"想"再"打字"，三段随机延迟；偶尔出现 5~25 秒的长停顿（像放下手机）。
  2. 沉默层：被点名也可能不回（深夜概率更高）；但只要是被直接提问就不沉默。
  3. 情绪层：活力（懒散↔活力）、情绪（伤心↔开心）、脾气（生气↔温柔）三条独立的轴，
     各自向基线衰减，被夸、被骂、被催、被拉去玩都会推对应的那条。被推完会按住几分钟不回弹，
     没发生什么的时候不写状态词——默认是"跟平时一样"，不是"一直懒散"。
     语气硬度可调：默认只准话少、不准刻薄，`mood.edge` / `mood.temper_floor` / `prompt_extra` 三个旋钮。
  4. 形态层：清洗 Markdown / 括号动作 / 客套腔，强制短句（默认 <20 字），避免自相矛盾，偶尔拆成两条发。

  设计目标是"过图灵测试"的那种群聊参与感：少说、说半句、会拒绝、会不耐烦，
  而不是每句话都礼貌完整。人格本身仍由 AstrBot 的叶铭（认主）提供，本插件只改"怎么说"。

  默认关闭，必须在配置里把群号填进 groups 才会生效。
