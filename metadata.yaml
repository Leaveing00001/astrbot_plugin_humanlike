name: astrbot_plugin_humanlike
display_name: 人味层 · 让叶铭像个人
short_desc: 只改"怎么说"：压短句、三条情绪轴、输出后再补节奏，顺手把 LLM 报错挡在群里之外
desc: |-
  把机器人从"有问必答的客服"改造成"群里的一个真人"。

  **不决定回不回**——要不要开口由上游（AstrBot 本身、Proactive Chat、angel_heart）决定。
  本插件接的是它已经生成好的那条完整回复，只负责"怎么发、说多短、什么语气"。

  五层机制（按一次回复的先后顺序）：
  1. 记账层：把人话记下来、按内容推情绪。不裁决、不拦截。
  2. 提示层：把"怎么说"写进提示词；群里额外引导它用引用（reply_to）和艾特（[At:QQ号]），
     让对话有指向性——但要接的不是最新那条、或者好几个人同时说话时才用，一条一个。
  3. 形态层：清洗 Markdown / 括号动作 / 客套腔，强制短句（默认 <20 字），避免自相矛盾，
     偶尔拆成两条发。
  4. 节奏层：完整回复到手之后才决定——秒回，还是停一下再发。停顿不占模型生成时间。
  5. 兜底层：LLM 报错只写日志、绝不发进群；历史里格式不合法的图片块换成 [图片]，
     免得 text-only 的模型整轮 400。

  情绪：活力（懒散↔活力）、情绪（伤心↔开心）、脾气（生气↔温柔）三条独立的轴，各自向基线衰减，
  被夸、被骂、被催、被拉去玩都会推对应的那条；被推完按住几分钟不回弹，没发生什么时不写状态词。
  语气硬度可调：默认只准话少、不准刻薄，`mood.edge` / `mood.temper_floor` / `prompt_extra` 三个旋钮。

  人格本身仍由 AstrBot 的叶铭（认主）提供，本插件只改"怎么说"。
  面板里自带设置页（插件 → 人味层 → 页面），改完点「保存并生效」，不用重启。
